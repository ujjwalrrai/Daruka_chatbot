services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cee-postgres

    environment:
      POSTGRES_DB: cee
      POSTGRES_USER: cee
      POSTGRES_PASSWORD: cee

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cee -d cee"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: cee-api

    environment:
      DATABASE_URL: postgresql+psycopg://cee:cee@postgres:5432/cee

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app/backend
      - ./data:/app/data

    depends_on:
      postgres:
        condition: service_healthy

    command: /app/.venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8000

    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: daruka_postgres_data